# 3DS App Manager Configuration
# This file will be created automatically at: sdmc:/3ds/3ds-app-manager/config.ini
#
# Path where save backups will be stored
backup_path=sdmc:/3ds/3ds-app-manager/backups
# Force backup before uninstall (0=ask, 1=always)
force_backup=0
# Skip uninstall confirmation dialog (0=show, 1=skip)
skip_uninstall_confirm=0
# Force restore save on install if backup exists (0=ask, 1=always)
force_restore=0
# Skip install confirmation dialog (0=show, 1=skip)
skip_install_confirm=0
# Note: all CIA installs target SD card (NAND option removed)
