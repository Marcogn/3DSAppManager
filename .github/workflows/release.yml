name: Release 3DS Homebrew

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Extract changelog for this tag
        id: changelog
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"   # strip leading 'v'

          # 1. Try exact match: heading must start with "## v<VERSION>" followed by
          #    a space or end-of-line (e.g. tag v2.2.0 -> "## v2.2.0 – ...").
          BODY=$(awk -v ver="## v${VERSION}" '
            found && /^## / { exit }
            found { print }
            $0 ~ ("^" ver "([[:space:]]|$)") { found=1; print }
          ' CHANGELOG.md)

          # 2. If not found, try prefix match: heading starts with "## v<VERSION>."
          #    (e.g. tag v2 matches "## v2.2.0 – ...").
          if [ -z "$BODY" ]; then
            BODY=$(awk -v ver="## v${VERSION}." '
              found && /^## / { exit }
              found { print }
              index($0, ver) == 1 { found=1; print }
            ' CHANGELOG.md)
          fi

          # Fail loudly if no section was found so a bad tag doesn't produce
          # release notes from the wrong version.
          if [ -z "$BODY" ]; then
            echo "::error::No CHANGELOG.md section found for tag '${TAG}'. Add a '## v${VERSION}' heading before releasing."
            exit 1
          fi

          # Write to a file to preserve multi-line content
          printf '%s\n' "$BODY" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ github.ref_name }}"
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: |
            *.3dsx
            *.smdh
          fail_on_unmatched_files: true
