name: Host-side Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install build tools
      run: sudo apt-get install -y build-essential

    - name: Run host-side unit tests
      run: make -C tests

    - name: Verify test binaries exit 0
      run: |
        cd tests
        ./test_utils
        ./test_config
        ./test_titles
        ./test_backup
        ./test_install
