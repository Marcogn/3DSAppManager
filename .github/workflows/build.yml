name: Build 3DS Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build
      run: |
        make

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: 3ds-fast-uninstall
        path: |
          *.3dsx
          *.smdh
